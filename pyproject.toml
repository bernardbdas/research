[project]
name = "research"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.12"

dependencies = [
    "flax>=0.12.10",
    "flwr-datasets[vision]>=0.6.1",
    "flwr[simulation]>=1.39.0",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jax>=0.11.2",
    "optax>=0.2.8",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[dependency-groups]
dev = [
    "mdformat>=1.0.0",
    "mdformat-gfm>=1.0.0",
    "mdformat-ruff>=0.1.3",
    "pre-commit>=4.6.2",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 88
target-version = "py313"

# Include Python files and Jupyter notebooks
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = [
    "F401",  # allow exploratory imports in notebook cells
    "E402",  # allow imports throughout notebook cells
    "F841",  # allow unused scratch variables
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
