00" font-size="13" font-family="'Helvetica'">•</text><text x="80.323" y="189.7" fill="#000" font-size="13" textLength="44.77" font-weight="700" font-family="'Helvetica'">MNIST:</text><text x="128.705" y="189.7" fill="#000" font-size="13" textLength="181.752" font-family="'Helvetica'">70,000 digits (28×28 grayscale)</text><text x="72.16" y="202.7" fill="#000" font-size="13" font-family="'Helvetica'">•</text><text x="80.323" y="202.7" fill="#000" font-size="13" textLength="98.935" font-weight="700" font-family="'Helvetica'">Fashion-MNIST:</text><text x="182.869" y="202.7" fill="#000" font-size="13" textLength="132.971" font-family="'Helvetica'">70,000 clothing articles</text><text x="72.16" y="215.7" fill="#000" font-size="13" font-family="'Helvetica'">•</text><text x="80.323" y="215.7" fill="#000" font-size="13" textLength="39.73" font-weight="700" font-family="'Helvetica'">USPS:</text><text x="123.665" y="215.7" fill="#000" font-size="13" textLength="150.3" font-family="'Helvetica'">9,298 low-res postal digits</text><text x="72.16" y="228.7" fill="#000" font-size="13" textLength="228.554" font-family="'Helvetica'">• Deterministic Apache Parquet caching</text></g><!--entity ClientCard--><g class="entity" data-qualified-name="Setup1.S2.ClientCard" id="ent0005" data-source-line="40"><rect x="422.5" y="163.69" width="206.996" height="71" fill="#FFF" style="stroke:#334155;stroke-width:1.8;" rx="6" ry="6"/><text x="432.5" y="176.7" fill="#000" font-size="13" textLength="174.827" font-weight="700" font-family="'Helvetica'">Decentralized Edge Network</text><text x="432.5" y="189.7" fill="#000" font-size="13" textLength="117.997" font-family="'Helvetica'">• Total Edge Clients:</text><text x="554.108" y="189.7" fill="#000" font-size="13" textLength="65.387" font-weight="700" font-family="'Helvetica'">K = 5 to 10</text><text x="432.5" y="202.7" fill="#000" font-size="13" textLength="150.167" font-family="'Helvetica'">• Local Batch Size: B = 64</text><text x="432.5" y="215.7" fill="#000" font-size="13" textLength="170.733" font-family="'Helvetica'">• Deterministic client seed: 42</text><text x="432.5" y="228.7" fill="#000" font-size="13" textLength="179.397" font-family="'Helvetica'">• No inter-client communication</text></g><!--entity RegIID--><g class="entity" data-qualified-name="Setup1.S3.RegIID" id="ent0007" data-source-line="44"><rect x="726.67" y="176.69" width="344.67" height="45" fill="#EFF6FF" style="stroke:#334155;stroke-width:1.8;" rx="6" ry="6"/><text x="736.67" y="189.7" fill="#000" font-size="13" textLength="137.954" font-weight="700" font-family="'Helvetica'">Regime A: Uniform IID</text><text x="736.67" y="202.7" fill="#000" font-size="13" textLength="324.67" font-family="'Helvetica'">• Every client gets an equal, balanced slice of all classes</text><text x="736.67" y="215.7" fill="#000" font-size="13" textLength="215.528" font-family="'Helvetica'">• Baseline control scenario (No skew)</text></g><!--entity RegDir--><g class="entity" data-qualified-name="Setup1.S3.RegDir" id="ent0008" data-source-line="46"><rect x="755.56" y="301.69" width="286.881" height="45" fill="#FFF7ED" style="stroke:#334155;stroke-width:1.8;" rx="6" ry="6"/><text x="765.56" y="314.7" fill="#000" font-size="13" textLength="247.444" font-weight="700" font-family="'Helvetica'">Regime B: Dirichlet Label Skew (α = 0.5)</text><text x="765.56" y="327.7" fill="#000" font-size="13" textLength="210.425" font-family="'Helvetica'">• Non-IID Dirichlet distribution: Dir(α)</text><text x="765.56" y="340.7" fill="#000" font-size="13" textLength="266.881" font-family="'Helvetica'">• Realistic heterogeneous label concentrations</text></g><!--entity RegPath--><g class="entity" data-qualified-name="Setup1.S3.RegPath" id="ent0009" data-source-line="48"><rect x="751.25" y="383.69" width="295.501" height="45" fill="#FEF2F2" style="stroke:#334155;stroke-width:1.8;" rx="6" ry="6"/><text x="761.25" y="396.7" fill="#000" font-size="13" textLength="182.044" font-weight="700" fo