urs)</text><text x="1047.38" y="250.74" fill="#000" font-size="12" font-family="'Helvetica'">•</text><text x="1054.915" y="250.74" fill="#000" font-size="12" textLength="107.982" font-weight="700" font-family="'Helvetica'">Lightweight Trunk:</text><text x="1166.232" y="250.74" fill="#000" font-size="12" textLength="150.064" font-family="'Helvetica'">Strided Conv (126k params)</text><text x="1047.38" y="262.74" fill="#000" font-size="12" font-family="'Helvetica'">•</text><text x="1054.915" y="262.74" fill="#000" font-size="12" textLength="98.016" font-weight="700" font-family="'Helvetica'">Decoupled State:</text><text x="1156.265" y="262.74" fill="#000" font-size="12" font-family="'Helvetica'">M</text><text x="1166.261" y="265.43" fill="#000" font-size="9" font-family="'Helvetica'">t</text><text x="1172.095" y="262.74" fill="#000" font-size="12" textLength="122.063" font-family="'Helvetica'">stays private on device</text><text x="1047.38" y="277.74" fill="#000" font-size="12" font-family="'Helvetica'">•</text><text x="1054.915" y="277.74" fill="#000" font-size="12" textLength="89.344" font-weight="700" font-family="'Helvetica'">Zero-Backprop:</text><text x="1147.593" y="277.74" fill="#000" font-size="12" textLength="182.063" font-family="'Helvetica'">Forward-pass associative surprise</text></g><!--entity D3_Trad--><g class="entity" data-qualified-name="Dim3.D3_Trad" id="ent0010" data-source-line="54"><rect x="1049.71" y="414" width="277.613" height="54" fill="#FFF7ED" style="stroke:#334155;stroke-width:1.5;" rx="5" ry="5"/><text x="1059.71" y="426.24" fill="#000" font-size="12" textLength="167.338" font-weight="700" font-family="'Helvetica'">Traditional HOPE (DeepMind)</text><text x="1059.71" y="438.24" fill="#000" font-size="12" font-family="'Helvetica'">•</text><text x="1067.245" y="438.24" fill="#000" font-size="12" textLength="127.354" font-weight="700" font-family="'Helvetica'">Centralized Optimizer:</text><text x="1197.933" y="438.24" fill="#000" font-size="12"